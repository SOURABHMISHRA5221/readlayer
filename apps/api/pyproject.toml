[project]
name = "readlayer-api"
version = "0.1.0"
description = "ReadLayer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "google-cloud-aiplatform>=1.38",
    "google-cloud-firestore>=2.34.0",
    "litellm==1.104.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
