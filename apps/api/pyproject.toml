[project]
name = "readlayer-api"
version = "0.1.0"
description = "ReadLayer API"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi[standard]>=0.142.2",
    "google-cloud-aiplatform>=1.38",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-storage>=3.16.0",
    "httpx>=0.28.1",
    "litellm==1.104.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
