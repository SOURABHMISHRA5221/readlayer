# Non-secret Cloud Run env vars. Secrets come from Secret Manager (see Makefile deploy-api).
ENV: prod
LOG_LEVEL: INFO
GCP_PROJECT: readlayer-sourabh-26
VERTEX_LOCATION: global
MODEL_FAST: vertex_ai/gemini-3.5-flash-lite
MODEL_QUALITY: vertex_ai/gemini-3.8-flash
MODEL_FALLBACK: vertex_ai/google/gemma-4-26b-a4b-it-maas
LLM_DAILY_BUDGET_USD: "8"
MODEL_EMBED: vertex_ai/gemini-embedding-001
EMBED_DIM: "256"
CONCEPTS_URI: gs://readlayer-sourabh-26-graph/concepts.json
LINK_THRESHOLD: "0.865"
# Browser origins allowed by CORS: the Firebase Hosting origins and the Gloss extension (M8; its
# id is fixed by the public key in apps/extension/manifest.base.json).
CORS_ORIGINS: https://readlayer-sourabh-26.web.app,https://readlayer-sourabh-26.firebaseapp.com,chrome-extension://lnfamfbeffepopbmedfenfmgljoacbmg
# M2.2 online concept growth: on since the seeded graph serves (2026-10-10, revision 00014+).
GROWTH_ENABLED: "true"
# Growth caps (code defaults 25 and 100). Raised on Sourabh's yes, 2026-10-13, live since revision
# 00026: five new articles used a reader's whole day (each reserves 5 slots and returns none), after
# which pages outside the graph got almost no notes. Cost at the higher cap: about $0.3 a day if all
# 60 articles grew at the mean of the 14 paid runs logged 2026-10-10 to 13 UTC ($0.0050; range $0.0024
# to $0.0127), about $0.8 at the dearest; the hard stop is LLM_DAILY_BUDGET_USD.
GROWTH_PER_UID_DAY: "60"
GROWTH_PER_DAY: "300"
# Decision 50: only this account's Google ID token, for this audience, may run the outlet collection.
FEED_JOB_SA_EMAIL: feed-job@readlayer-sourabh-26.iam.gserviceaccount.com
FEED_JOB_AUDIENCE: https://readlayer-api-d2sfihz3za-el.a.run.app/v1/internal/feeds/collect
