# media transcript regression cases (Media plan, decision 54, round 1 R13). Frozen before the
# first `transcribe-v1` build commit; never edited or dropped to make a number pass (decision 26).
# Any change to the transcribe prompt's wording reports before and after on these same cases in
# its PR. References come from the measurement runs of 2026-10-13 (docs/plans/media.md,
# "Evidence", rows 3, 7, 10, 11): Vertex, the production ledger, the measured wording.
# Words are counted as whitespace-separated tokens over all paragraphs. No transcript text is
# kept here: the recordings belong to their publishers; the join check uses a few words only.

- id: T01
  note: 16-minute lecture video, the whole recording in two windows (plan acceptance 1)
  kind: youtube
  url: https://www.youtube.com/watch?v=d6fUwCBvVc0
  duration_s: 949
  reference:
    model: quality, 1 frame / 10 s, low detail, default thinking (row 3)
    words: 1822
    paragraphs: 41
    first_start: "00:02"
    last_start: "15:26"
  expect:
    language: en
    words_min: 1640    # reference - 10%
    words_max: 2004    # reference + 10%
    last_start_min_s: 900
    times_non_decreasing: true

- id: T02
  note: 22-minute podcast episode, opened by its Apple episode link; MP3 cut into pieces
  kind: apple_podcast
  url: https://podcasts.apple.com/ie/podcast/a-gas-tax-holiday-is-performative-nonsense/id1523898793?i=1000770325688
  duration_s: 1347
  reference:
    # The only whole-episode reference came from the fast model (row 7) and may be low; the
    # quality model at low thinking gave 1,786 words on the first 10-minute piece alone (row 14).
    model: fast, whole file from gs:// (row 7)
    words: 4081
    paragraphs: 199
    first_start: "0:00"
    last_start: "22:08"
  expect:
    language: en
    words_min: 3600
    last_start_min_s: 1260
    times_non_decreasing: true

- id: T03
  note: one 10-minute window (50:00-60:00) of a 68-minute video; the fast model dropped a third
  kind: youtube_window
  url: https://www.youtube.com/watch?v=xFPILM4UUSg
  window_s: [3000, 3600]
  reference:
    model: quality, reasoning_effort low (row 11); default thinking gave 1,849 (row 10)
    words: 1753
    paragraphs: 22
    first_start: "50:00"
    last_start: "59:03"
    # Row 10's window ends mid-sentence ("... difficult to see that AIG was offering") and the
    # 60:00 window starts "insurance to depository institutions": the join rule's real case.
    ends_with: that AIG was offering
    next_window_starts_with: insurance to depository institutions
  expect:
    language: en
    words_min: 1580    # reference - 10%; the fast model's 1,124 and 1,219 fail this
    first_start_min_s: 3000
    last_start_max_s: 3605
    times_non_decreasing: true

# Added 2026-10-14 (plan Round 4 review, item 1), before any run of it: a new case, nothing above
# edited. One whole-URL call (no offsets) near the 20-minute cap, on a fast, dense speaker. No
# reference transcript exists: the word floor is a stated guess (about 140 words a minute, well
# under this speaker's pace), not a measurement. Its output tokens and latency decide the cap.
- id: T04
  note: 18.6-minute talk, dense speech, one call on the whole URL (plan Round 4, 4.2)
  kind: youtube
  url: https://www.youtube.com/watch?v=rrkrvAUbU9Y
  duration_s: 1117
  reference: none (videos.list: 1117 s, language en; checked 2026-10-14)
  expect:
    language: en
    words_min: 2600
    last_start_min_s: 1050
    times_non_decreasing: true
    # Decision rule (plan Round 4 review, item 1): over 60 s or over 7,000 output tokens →
    # MEDIA_MAX_VIDEO_S = 1000 instead of 1200 (T01 is 960 s by videos.list).
    latency_max_s: 60
    tokens_out_max: 7000

