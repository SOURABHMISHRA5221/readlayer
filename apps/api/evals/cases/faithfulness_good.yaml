    demand_id: d1
  span: Fisher equation
  concept:
    id: c_fisher_equation
    label: Fisher equation
    definition: The Fisher equation states that the nominal interest rate is the sum of the real interest
      rate and the expected inflation rate.
    prerequisites:
    - label: Nominal interest rate
      definition: The nominal interest rate is the stated interest rate of a loan or financial product
        before taking inflation into account.
    - label: Real interest rates
      definition: The nominal interest rate adjusted for the rate of inflation, reflecting the true cost
        of borrowing and the real yield on investments.
    - label: Inflation
      definition: The general increase in prices and fall in the purchasing value of money over time.
  band: heard of
  thinks_in: law
  paragraph: The real interest rate is the rate of interest an investor, saver or lender receives (or
    expects to receive) after allowing for inflation. It can be described more formally by the Fisher
    equation, which states that the real interest rate is approximately the nominal interest rate minus
    the inflation rate.
  card:
    background: The nominal interest rate is the rate that is quoted; the real rate adjusts it for inflation,
      showing how much purchasing power a saver actually gains.
    author_says: The real interest rate can be described by the Fisher equation, which states that the
      real rate is approximately the nominal interest rate minus the inflation rate.
