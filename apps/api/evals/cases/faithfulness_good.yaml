  thinks_in: cricket
  paragraph: '- A registered bond is a bond whose ownership (and any subsequent purchaser) is recorded
    by the issuer, or by a transfer agent. Interest payments and the principal upon maturity are sent
    to the registered owner. The owner can continue to receive interest with a duplicated bond in case
    of a loss. However, the bond is not easily transferable to other people. Registered bonds seldom appeared
    in the market for trading. The traceability of the bonds means it has a minor effect on bond prices.
