  concept:
    id: c_spot_market
    label: Spot market
    definition: A financial market where assets are bought or sold for immediate delivery and payment.
    prerequisites:
    - label: Cash markets
      definition: Financial markets where securities are bought and sold for immediate delivery and settlement.
  band: heard of
  thinks_in: software
  paragraph: Trading on commodities began in Japan in the 18th century with the trading of rice and silk,
    and similarly in Holland with tulip bulbs. Trading in the US began in the mid 19th century when central
    grain markets were established and a marketplace was created for farmers to bring their commodities
    and sell them either for immediate delivery (also called spot or cash market) or for forward delivery.
    These forward contracts were private contracts between buyers and sellers and became the forerunner
    to today's exchange-traded futures contracts. Although contract trading began with traditional commodities
    such as grains, meat, and livestock, exchange trading has expanded to include metals, energy, currency
    and currency indexes, equities and equity indexes, government interest rates, and private interest
    rates.
  card:
    background: In a spot or cash market, goods or assets are paid for and delivered straight away. In
      a forward deal, the price is agreed now but delivery happens later.
    author_says: Commodity trading in the US began in the mid-19th century, when central grain markets
      were set up where farmers could sell their commodities either for immediate delivery, known as the
      spot or cash market, or for forward delivery.
