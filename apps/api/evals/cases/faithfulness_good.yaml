- id: G02
  mode: span
  source:
    site: Wikimedia Foundation, Inc.
    content_id: 454a6f88b5ae325cb3160425c12997f4
    demand_id: d238
  span: deflation
  concept:
    id: c_deflation
    label: Deflation
    definition: A general decline in prices for goods and services, typically associated with a contraction
      in the supply of money and credit.
    prerequisites:
    - label: Inflation
      definition: The general increase in prices and fall in the purchasing value of money over time.
  band: heard of
  thinks_in: software
  paragraph: 'Freiwirtschaft economists theorize that demurrage currency could eliminate both inflation
    and deflation. There tends to be some interest cost that is built into the goods and services that
    consumers tend to purchase,[164]: 4 so if demurrage currency eliminates interest rates, then prices
    are less likely to increase. Demurrage would also naturally cause the money supply to decrease, thus
    causing deflation. If a central bank issues and monitors demurrage currency as Gesell originally proposed,
    then it could replace all the money that disappears due to demurrage by printing money at a similar
    rate.[165] The money printing could create just enough inflation to cancel out the natural deflation
    of demurrage, thus achieving an inflation target of 0%.[166]'
  card:
    background: Deflation is a general fall in the prices of goods and services. It is usually linked
      to a shrinking supply of money and credit.
    author_says: Economists of the Freiwirtschaft school theorize that a demurrage currency could eliminate
      both inflation and deflation.
