  paragraph: Water companies in England are required by law to take industrial wastewater and issue
    permits called “trade-effluent consents” that allow businesses to send it to sewage works, though
    water companies can refuse applications.
  card:
    background: A trade effluent consent is a permit from a water company that allows a business to
      send industrial wastewater into the public sewer, usually with conditions on what it can send.
    author_says: The article says water companies in England are legally required to take industrial
      wastewater and to issue trade-effluent consents letting businesses send it to sewage works, though
