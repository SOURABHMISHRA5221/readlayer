- id: O02
  mode: span
  domain: sports
  source:
    site: The Guardian
    url: https://www.theguardian.com/football/2026/oct/09/west-ham-qpr-championship-report-penalties
  span: VAR review
  concept:
    id: c_var
    label: Video assistant referee
    definition: A football officiating system in which officials review video replays to help the
      referee correct clear and obvious errors in key match decisions.
    prerequisites: []
  band: unaware
  thinks_in: software
  paragraph: West Ham were earlier on the wrong end of a dreadful penalty decision after Tomas Soucek
    was penalised for fouling Paul Smyth. Replays showed the challenge was well outside the area and
    that the Hammers midfielder got the ball. A VAR review would have definitely overturned referee
    Ruebyn Ricardo’s decision but with no technology in the Championship it stood, to the dismay of the
    majority inside the London Stadium.
  card:
    background: VAR (video assistant referee) lets match officials check video replays and advise the
      referee to change a clear and obvious mistake in a key decision, such as a penalty.
    author_says: The writer says a VAR review would definitely have overturned the referee's penalty
      decision, but because the Championship has no such technology, the decision stood, to the dismay
      of most of the crowd at the London Stadium.
- id: O03
  mode: span
  domain: science
  source:
    site: The Guardian
    url: https://www.theguardian.com/science/2026/oct/07/jonathan-the-giant-tortoise-194-offers-up-insight-into-secrets-of-longevity
  span: mitochondria
  concept:
    id: c_mitochondria
    label: Mitochondria
    definition: Structures inside cells that turn nutrients into the chemical energy the cell uses.
    prerequisites:
    - label: Cell
      definition: The smallest unit of a living thing that can carry out the processes of life.
  band: heard of
  thinks_in: null
  paragraph: But more intriguing to the researchers were chemical patterns on Jonathan’s genes that
    appear to protect the healthy functioning of his mitochondria, the tiny battery-like structures that
    power biological cells. Ailing mitochondria have been strongly linked to ageing and age-related
    diseases.
  card:
    background: Mitochondria are tiny structures inside cells that convert nutrients into the energy
      the cell runs on.
    author_says: The researchers found chemical patterns on Jonathan's genes that appear to protect the
      healthy working of his mitochondria, and the article notes that failing mitochondria have been
      strongly linked to ageing and age-related diseases.
- id: O04
  mode: span
  domain: science
  source:
    site: The Guardian
    url: https://www.theguardian.com/science/2026/oct/07/jonathan-the-giant-tortoise-194-offers-up-insight-into-secrets-of-longevity
  span: methyl groups
  concept:
    id: c_dna_methylation
    label: DNA methylation
    definition: The attachment of small chemical tags called methyl groups to DNA, which can switch
      genes off without changing the genetic code itself.
    prerequisites:
    - label: Gene
      definition: A stretch of DNA that carries the instructions for making a particular product in a
        cell.
  band: unaware
  thinks_in: software
  paragraph: The insight came when the international team, led by Benjamin Vaisvil, looked at chemical
    tags that attach to DNA, creating patterns that change over time. The tags, known as methyl groups,
    typically silence the genes they latch on to.
  card:
    background: DNA methylation is when small chemical tags called methyl groups attach to DNA. They can
      switch genes off without changing the genetic code itself.
    author_says: The international team led by Benjamin Vaisvil found the insight by looking at chemical
      tags on DNA, known as methyl groups, which form patterns that change over time and typically
      silence the genes they attach to.
