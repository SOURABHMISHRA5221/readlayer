- id: O06
  mode: span
  domain: culture
  source:
    site: The Guardian
    url: https://www.theguardian.com/books/2026/oct/10/people-forgot-i-existed-audrey-niffenegger-on-taking-14-years-to-write-a-sequel-to-the-time-travelers-wife
  span: impostor syndrome
  concept:
    id: c_impostor_syndrome
    label: Impostor syndrome
    definition: A persistent feeling of not deserving one's success and fearing being exposed as a fraud,
      despite evidence of competence.
    prerequisites: []
  band: heard of
  thinks_in: null
  paragraph: Becoming a sudden commercial success was “very odd”, she recalls, “all the running around
    and doing interviews and having people dig really deep into the novel and have very intricate
    questions was extraordinary”. The scrutiny didn’t trouble her too much – it reminded her of being
    critiqued at art school – but she struggled with “impostor syndrome”.
  card:
    background: Impostor syndrome is a lasting feeling that you don't deserve your success and might be
      exposed as a fraud, even when there is evidence that you are good at what you do.
    author_says: Niffenegger recalls that sudden commercial success felt very odd; the scrutiny did not
      trouble her much, as it reminded her of critiques at art school, but she says she struggled with
      impostor syndrome.
