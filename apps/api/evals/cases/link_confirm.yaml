# link_confirm regression cases (M2.2, issue #6, decision 34). Written and committed before the
# first model run; never edited or dropped to make a number pass (decision 26).
# Each case is self-contained: the phrase, its sentence, the article's site and the candidates
# exactly as the linker would show them (id, label, definition, plus kind and jurisdiction,
# which only link_confirm v3 renders). `expect`: the acceptable ids; an empty list means the
# right answer is null (no candidate explains the phrase). Before = link_confirm-v2, after = v3.
# Held-out sentences (L01, L03, L04) appear here only as regression cases; the v3 prompt's own
# examples use different wording (plan §D.4).

- id: L01
  note: UK Chancellor (held-out Guardian sentence) must not link to the US Treasury Secretary
  phrase: Chancellor
  site: The Guardian
  sentence: >-
    The meeting comes as Chancellor John Healey prepares for his first Budget next month, with
    rising borrowing costs in recent weeks adding to the pressure on government finances.
  candidates:
    - {id: c_treasury_secretary, label: Treasury Secretary, kind: role, jurisdiction: US,
       definition: "A cabinet-level government official responsible for managing a nation's treasury, public finances, and economic policy."}
    - {id: c_chancellor_of_the_exchequer, label: Chancellor of the Exchequer, kind: role, jurisdiction: GB,
       definition: "The UK government minister in charge of the Treasury, responsible for taxes, public spending and the annual Budget."}
  expect: [c_chancellor_of_the_exchequer]

